; OpenCode Buddy — firmware (Phase 1)
;
; Hardware facts are taken from the proven reference project:
;   ../Codex-Quota-Mini/include/display.h and src/main.cpp
; Do not change pins or panel parameters without re-running the hardware audit.

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBUDDY_MOCK_MODE=0
  -DBUDDY_DIAGNOSTICS=0
  -DBUDDY_BENCH_COMMANDS=0

; LovyanGFX for the panel, ArduinoJson for the NDJSON protocol (Phase 2).
lib_deps =
  lovyan03/LovyanGFX@1.2.21
  bblanchon/ArduinoJson@7.4.3

; Diagnostic-only build for the Phase 3.1 hardware validation. It runs the local
; mock scenario and prints BUDDY-DIAG lines on USB CDC; it is never the release
; image and must be reflashed away after the measurements. Keep every other
; setting identical to [env:supermini].
[env:supermini-diag]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBUDDY_MOCK_MODE=1
  -DBUDDY_DIAGNOSTICS=1
  -DBUDDY_BENCH_COMMANDS=0

lib_deps =
  lovyan03/LovyanGFX@1.2.21
  bblanchon/ArduinoJson@7.4.3
