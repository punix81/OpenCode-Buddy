; OpenCode Buddy — firmware (Phase 1)
;
; Hardware facts are taken from the proven reference project:
;   ../Codex-Quota-Mini/include/display.h and src/main.cpp
; Do not change pins or panel parameters without re-running the hardware audit.

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBUDDY_MOCK_MODE=1

; LovyanGFX only. ArduinoJson is intentionally not a Phase 1 dependency: the
; protocol parser arrives in Phase 2, and an unused dependency is a liability.
lib_deps =
  lovyan03/LovyanGFX@1.2.21
